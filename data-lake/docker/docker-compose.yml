# Airflow del data lake de noticias, en la EC2. PostgreSQL solo guarda los metadatos de Airflow.
# Las variables salen del .env que arma scripts/compadre.sh desplegar.

name: lago-aws

x-airflow: &airflow
  image: local/dl-airflow:1
  build:
    context: ./docker
  user: "${AIRFLOW_UID:-1000}:0"
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PYTHONPATH: /opt/airflow/src
    AWS_REGION: ${AWS_REGION}
    DL_BUCKET: ${DL_BUCKET}
    DL_BASE_DATOS: ${DL_BASE_DATOS}
    DL_WORKGROUP: ${DL_WORKGROUP}
    DL_PROGRAMAR: ${DL_PROGRAMAR:-0}
  volumes:
    - ./src/airflow/dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - airflow_logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    command: version

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow_logs:
  postgres_data:
